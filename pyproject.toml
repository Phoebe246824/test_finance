[project]
name = "test-sentinel"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "crewai>=1.14.5",
    "fastapi>=0.136.3",
    "graphiti-core>=0.29.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "neo4j>=6.2.0",
    "pika>=1.4.1",
    "playwright>=1.56.0",
    "plotly>=6.1.0",
    "pydantic>=2.12.5",
    "pymilvus>=3.0.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.2.2",
    "redis>=7.4.0",
    "ulid-py>=1.1.0",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests requiring live Redis/Milvus/Neo4j/LLM services (deselect with '-m \"not integration\"')",
]
