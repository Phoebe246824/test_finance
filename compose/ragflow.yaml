services:
  ragflow-mysql:
    profiles: ["ragflow"]
    container_name: ragflow-mysql
    image: mysql:8.0.39
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${RAGFLOW_MYSQL_PASSWORD:-ragflow}
      MYSQL_DATABASE: ${RAGFLOW_MYSQL_DATABASE:-rag_flow}
    ports:
      - "${RAGFLOW_MYSQL_PORT:-13306}:3306"
    volumes:
      - ./volumes/ragflow/mysql:/var/lib/mysql
    networks:
      - devopsnetwork

  ragflow-redis:
    profiles: ["ragflow"]
    container_name: ragflow-redis
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${RAGFLOW_REDIS_PASSWORD:-infini_rag_flow}
    ports:
      - "${RAGFLOW_REDIS_PORT:-16379}:6379"
    volumes:
      - ./volumes/ragflow/redis:/data
    networks:
      - devopsnetwork

  ragflow-minio:
    profiles: ["ragflow"]
    container_name: ragflow-minio
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: always
    environment:
      MINIO_ROOT_USER: ${RAGFLOW_MINIO_USER:-ragflow}
      MINIO_ROOT_PASSWORD: ${RAGFLOW_MINIO_PASSWORD:-ragflow123}
      MINIO_USER: ${RAGFLOW_MINIO_USER:-ragflow}
      MINIO_PASSWORD: ${RAGFLOW_MINIO_PASSWORD:-ragflow123}
    command: minio server /data --console-address ":9001"
    ports:
      - "${RAGFLOW_MINIO_API_PORT:-19000}:9000"
      - "${RAGFLOW_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - ./volumes/ragflow/minio:/data
    networks:
      - devopsnetwork

  ragflow-es:
    profiles: ["ragflow"]
    container_name: ragflow-es
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    restart: always
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${RAGFLOW_ES_JAVA_OPTS:--Xms1g -Xmx1g}
    ports:
      - "${RAGFLOW_ES_PORT:-11200}:9200"
    volumes:
      - ./volumes/ragflow/es:/usr/share/elasticsearch/data
    networks:
      - devopsnetwork

  ragflow:
    profiles: ["ragflow"]
    container_name: ragflow
    image: ${RAGFLOW_IMAGE:-infiniflow/ragflow:v0.26.1}
    restart: always
    command:
      - --enable-adminserver
      - --init-model-provider-tables
    depends_on:
      - ragflow-mysql
      - ragflow-redis
      - ragflow-minio
      - ragflow-es
    environment:
      DOC_ENGINE: elasticsearch
      DEVICE: cpu
      API_PROXY_SCHEME: python
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_HOST: ragflow-mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${RAGFLOW_MYSQL_PASSWORD:-ragflow}
      MYSQL_DBNAME: ${RAGFLOW_MYSQL_DATABASE:-rag_flow}
      REDIS_HOST: ragflow-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${RAGFLOW_REDIS_PASSWORD:-infini_rag_flow}
      MINIO_HOST: ragflow-minio
      MINIO_USER: ${RAGFLOW_MINIO_USER:-ragflow}
      MINIO_PASSWORD: ${RAGFLOW_MINIO_PASSWORD:-ragflow123}
      ES_HOST: ragflow-es
      ES_PORT: 9200
      ELASTIC_PASSWORD: ${RAGFLOW_ELASTIC_PASSWORD:-infini_rag_flow}
      SVR_WEB_HTTP_PORT: 80
      SVR_WEB_HTTPS_PORT: 443
      SVR_HTTP_PORT: 9380
      ADMIN_SVR_HTTP_PORT: 9381
      SVR_MCP_PORT: 9382
      GO_HTTP_PORT: 9384
      GO_ADMIN_PORT: 9383
    ports:
      - "${RAGFLOW_WEB_PORT:-8088}:80"
      - "${RAGFLOW_API_PORT:-9380}:9380"
      - "${RAGFLOW_ADMIN_API_PORT:-9381}:9381"
    volumes:
      - ./volumes/ragflow/logs:/ragflow/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - devopsnetwork
