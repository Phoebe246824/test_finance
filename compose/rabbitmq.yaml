services:

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4.0.9-management
    restart: always
    hostname: rabbitserver
    environment:
      RABBITMQ_DEFAULT_VHOST: admin_vhost
      RABBITMQ_DEFAULT_USER: root
      RABBITMQ_DEFAULT_PASS: pa55w0rd
      RABBITMQ_PLUGINS_DIR: "/plugins:/myplugins"
    ports:
      - "5672:5672"     # AMQP 协议
      - "15672:15672"   # Management UI
    volumes:
      - ./volumes/rabbitmq/data:/var/lib/rabbitmq
      - ./volumes/rabbitmq/myplugins:/myplugins
    networks:
      - devopsnetwork

networks:
  devopsnetwork:
    driver: bridge
